# @package _global_
# RunPod launcher configuration: one pod, so the same basic launcher as local,
# with wandb on

defaults:
  - override /hydra/launcher: basic

# Workers are spawned (stable_worldmodel forces spawn for LanceDB), and each one
# uses ~1 GB and many threads. With 16 (x2 for train + val), a pod with a 58 GB
# memory limit and 8704 threads crashed. 6 was tested on that pod and works.
# The worker count does not change the training result.
num_workers: 6

wandb:
  enabled: True
  config:
    entity: librakevin-workday
    project: lewm
    name: ${run_name}
    id: ${subdir}
    resume: allow
    log_model: False
