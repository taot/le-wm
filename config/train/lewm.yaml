defaults:
  - _self_
  - launcher: local
  - data: pusht
  - model: lewm

output_model_name: lewm
# checkpoints go to <checkpoints dir>/<data.env>/<subdir>; pass subdir=<existing run> to resume it
subdir: ${now:%Y-%m-%d_%H%M%S}_img${img_size}_s${seed}
run_name: ${data.env}/${subdir}

# mirror the run folder to hf://buckets/... every N epochs and at the end of training
bucket:
  enabled: False
  uri: hf://buckets/librakevin/lewm-checkpoints
  every_n_epochs: 5

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 112
embed_dim: 192
history_size: 3

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

num_preds: 1

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024

wandb:
  config:
    entity: librakevin-workday
    project: lewm
