# Full-solve PushT: from a random start, push the block onto the green-T goal.
# Inherits pusht.yaml; see eval.py:evaluate_full_solve.
defaults:
  - pusht
  - _self_

eval:
  mode: full_solve
  num_eval: 8
  eval_budget: 300 # expert demos take ~120 steps (90th pct ~170)
  # most common final agent position (clear of the block) in demos ending on the green T
  goal_agent_pos: [153, 356]

output:
  filename: pusht_full_results.txt
